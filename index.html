<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>국비 교부신청서 작성기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;700&display=swap">
<style>
/* 레이아웃: 상단 고정 도구막대 + 탭(입력 / 미리보기 / 기록). 미리보기는 A4 종이 */
:root{
  --bg:#eef1ee; --surface:#ffffff; --field:#fbfcfb; --calc:#e8f0ec;
  --fg:#1c2421; --muted:#5b6661; --line:#d3dad5;
  --accent:#1f5c4a; --accent-fg:#ffffff; --accent-soft:#dbe9e2;
  --bad:#b3261e; --bad-soft:#fbe9e7; --good:#2e6e48; --good-soft:#e3f1e8; --warn:#8a5300; --warn-soft:#fbf0dc;
  --ui:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --doc:"HCR Batang","함초롬바탕","Noto Serif KR","Batang","바탕",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a18; --surface:#1d2522; --field:#18201d; --calc:#22302a;
  --fg:#e3eae6; --muted:#9aa7a1; --line:#33413b;
  --accent:#6fbf9f; --accent-fg:#0f1a16; --accent-soft:#25392f;
  --bad:#ff8a80; --bad-soft:#3a201e; --good:#8fd3a8; --good-soft:#1f3328; --warn:#f0b35a; --warn-soft:#3a2f1c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a18; --surface:#1d2522; --field:#18201d; --calc:#22302a;
  --fg:#e3eae6; --muted:#9aa7a1; --line:#33413b;
  --accent:#6fbf9f; --accent-fg:#0f1a16; --accent-soft:#25392f;
  --bad:#ff8a80; --bad-soft:#3a201e; --good:#8fd3a8; --good-soft:#1f3328; --warn:#f0b35a; --warn-soft:#3a2f1c;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--ui)}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:6px 12px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.small{padding:2px 8px;font-size:12px}
button.danger{color:var(--bad)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

header.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px max(16px,2vw)}
.bar h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:2px 10px;font-weight:700;font-size:13px}
.spacer{flex:1}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.tabs{display:flex;gap:2px;padding:0 max(16px,2vw)}
.tabs button{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 14px;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:700}
#saved{font-size:12px;color:var(--muted)}

main{padding:16px max(16px,1.5vw) 60px;max-width:1880px;margin:0 auto}
.checks{border-radius:8px;padding:10px 14px;margin-bottom:14px;border:1px solid var(--line);background:var(--surface)}
.checks.ok{background:var(--good-soft);border-color:transparent;color:var(--good)}
.checks.ng{background:var(--bad-soft);border-color:transparent}
.checks b{display:block;margin-bottom:4px}
.checks.ng b{color:var(--bad)}
.checks ul{margin:0;padding-left:18px}

details.sec{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
details.sec>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:15px;list-style:none;display:flex;gap:8px;align-items:baseline}
details.sec>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.sec[open]>summary::before{transform:rotate(90deg)}
details.sec>summary small{font-weight:400;color:var(--muted);font-size:12px}
.sec-body{padding:4px 14px 14px;display:grid;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px 14px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
label.f{display:grid;gap:2px;font-size:12px;color:var(--muted);min-width:0}
input,textarea,select{font:inherit;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:5px;padding:5px 7px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.45;field-sizing:content;min-height:2.4em;overflow:hidden}
input.num{text-align:right;font-variant-numeric:tabular-nums}
output{display:block;background:var(--calc);border-radius:5px;padding:5px 7px;text-align:right;font-variant-numeric:tabular-nums;font-weight:500;min-height:30px}
output.bad{color:var(--bad);font-weight:700}
table.ed output:not(.diff){white-space:nowrap;overflow-wrap:normal;letter-spacing:-.02em}
output.diff{text-align:center;font-weight:700;font-size:12px;white-space:nowrap}
output.diff.ok{background:var(--good-soft);color:var(--good)}
output.diff.over,output.diff.under{background:var(--bad-soft);color:var(--bad)}
tr.target td{background:var(--surface)!important;color:var(--muted)}
tr.target td.lb,tr.diffrow td.lb{font-size:12px}
tr.diffrow td{background:var(--surface)!important}
.dpair{display:grid;grid-template-columns:auto 1fr;gap:2px 4px;align-items:center}
.dpair small{font-size:10.5px;color:var(--muted)}
.dpair output{min-height:22px;padding:2px 3px;font-size:11.5px}
.hint{font-size:12px;color:var(--muted);margin:0}
.scroll{overflow-x:auto}
table.ed{border-collapse:collapse;width:100%;font-size:13px}
table.ed th{background:var(--accent-soft);color:var(--fg);font-weight:500;font-size:12px;padding:5px 6px;border:1px solid var(--line);white-space:nowrap}
table.ed td{border:1px solid var(--line);padding:3px;vertical-align:top}
table.ed td.lb{white-space:pre-line;font-weight:500;padding:5px 6px;min-width:120px}
table.ed input.num{min-width:84px}
table.ed tfoot td{background:var(--calc)}
table.ed select{min-width:92px}
table.ed button{white-space:nowrap}
.unit-card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:8px}
.unit-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.unit-head strong{font-size:14px}
.row-btns{display:flex;gap:6px;flex-wrap:wrap}

.rec-table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:8px;overflow:hidden}
.rec-table th,.rec-table td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
.rec-table th{font-size:12px;color:var(--muted);font-weight:500}
.rec-table tr.cur td{background:var(--accent-soft)}
.rec-table td.n{text-align:right}

/* ---------- 사업 실적 · 검증 ---------- */
.yearsel{width:auto;font-weight:700;padding:4px 8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px;display:grid;gap:10px;min-width:0}
.panel h3{margin:0;font-size:15px}
.page-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin:2px 0 12px}
.page-head h2{margin:0;font-size:20px;letter-spacing:-.01em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:6px;align-content:start}
.card.total{border-color:var(--accent)}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card-top b{font-size:15px}
.card-top span{font-size:12px;color:var(--muted);text-align:right}
.big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.big small{font-size:14px;color:var(--muted);font-weight:500}
.big em{font-style:normal;font-size:15px;color:var(--accent);margin-left:6px}
.pbar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;display:flex}
.pbar .done{background:var(--accent)}
.pbar .plan{background:repeating-linear-gradient(45deg,var(--accent) 0 3px,transparent 3px 6px);opacity:.55}
.meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.err{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--good-soft);color:var(--good)}
table.mt{border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;width:100%}
table.mt th,table.mt td{border:1px solid var(--line);padding:4px 6px;text-align:center;min-width:34px}
table.mt th{font-weight:500;color:var(--muted)}
table.mt td.h1{background:color-mix(in srgb,var(--accent) 18%,transparent)}
table.mt td.h2{background:color-mix(in srgb,var(--accent) 38%,transparent)}
table.mt td.h3{background:color-mix(in srgb,var(--accent) 62%,transparent);color:var(--accent-fg)}
.addrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 12px;align-items:end}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select,.filters input{width:auto}
.issue{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.issue:first-of-type{border-top:none}
.issue .loc{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);padding:14px;text-align:center;border:1px dashed var(--line);border-radius:8px}
/* ---------- 표: 가로 스크롤 없이 화면 폭에 맞춤 ---------- */
#tab-input .scroll,#tab-settle .scroll,#tab-entry .scroll,#tab-status .scroll,#tab-records .scroll{overflow-x:visible}
table.ed{table-layout:fixed;width:100%;font-size:12.5px}
table.ed th{white-space:normal;word-break:keep-all;line-height:1.3;padding:4px 3px;font-size:11.5px}
table.ed td{padding:2px}
table.ed input,table.ed select,table.ed textarea{width:100%!important;min-width:0!important;padding:4px 4px;font-size:12.5px}
table.ed input.num{min-width:0!important}
table.ed input[type=date]{padding:3px 2px;font-size:11.5px}
table.ed td.lb{min-width:0;word-break:keep-all;font-size:12px;padding:4px}
table.ed output{min-height:26px;padding:4px;font-size:12.5px;overflow-wrap:anywhere}
table.ed button.small{padding:2px 5px}
table.ed td.btncell{display:grid;grid-template-columns:1fr 1fr;gap:2px}
table.ed td.btncell button{padding:1px 2px;font-size:11px}
table.ed .pill{white-space:normal}
table.ed td{overflow-wrap:anywhere}
table.mt{table-layout:fixed}
table.mt th,table.mt td{min-width:0;padding:4px 2px}
.rec-table{table-layout:auto;font-size:13px}
.rec-table td{word-break:keep-all}
.sheet-layout{grid-template-columns:172px minmax(0,1fr)}
/* ---------- 로그인 화면 ---------- */
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px));overflow:auto}
body.gated{overflow:hidden}
.gate-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:26px 26px 22px;display:grid;gap:14px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.gate-brand{display:grid;gap:2px;text-align:center;margin-bottom:4px}
.gate-brand b{font-size:19px;letter-spacing:-.01em}
.gate-brand span{font-size:12.5px;color:var(--muted)}
.gate-card h2{font-size:16px;margin:0}
.gate-card p{margin:0}
.gate-tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.gate-tabs button{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:9px 4px;color:var(--muted);font-weight:500}
.gate-tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:700}
.gate-form{display:grid;gap:10px}
.gate-form input{padding:9px 10px;font-size:14.5px}
.gate-form button.primary{padding:10px;font-size:15px;font-weight:700}
.gate-msg{font-size:13px;color:var(--good);background:var(--good-soft);border-radius:6px;padding:8px 10px}
.gate-msg.bad{color:var(--bad);background:var(--bad-soft)}
.linkbtn{border:none;background:none;color:var(--accent);text-decoration:underline;padding:2px;justify-self:center;font-size:13px}
/* ---------- 서버 상태 ---------- */
.cloudchip{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.cloudchip.ok{background:var(--good-soft);color:var(--good);border-color:transparent}
.cloudchip.sync,.cloudchip.dirty{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.cloudchip.conflict,.cloudchip.error{background:var(--bad-soft);color:var(--bad);border-color:transparent;font-weight:700}
.cloudchip.login{background:var(--warn-soft);color:var(--warn);border-color:transparent}
/* ---------- 시트 ---------- */
.sheet-layout{display:grid;gap:16px;align-items:start}
.subnav{position:sticky;top:118px;display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px}
.subnav button{border:none;background:none;text-align:left;padding:8px 10px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;gap:6px;color:var(--fg)}
.subnav button:hover{background:var(--accent-soft)}
.subnav button[aria-current="true"]{background:var(--accent);color:var(--accent-fg);font-weight:700}
.subnav .no{font-size:11px;opacity:.7;margin-right:6px;font-variant-numeric:tabular-nums}
.subnav .dot{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;min-width:18px;height:18px;display:inline-grid;place-items:center;padding:0 5px;font-weight:700}
#form details.sec.sheet{margin:0}
#form details.sec.sheet>summary{pointer-events:none;font-size:17px;padding:14px 16px 6px}
#form details.sec.sheet>summary::before{content:none}
.sheet-foot{display:flex;justify-content:space-between;gap:8px;padding:0 14px 14px}
.checks.compact{padding:8px 12px;font-size:13px}
@media (max-width:860px){
  .sheet-layout{grid-template-columns:1fr}
  .subnav{position:static;display:flex;overflow-x:auto;gap:4px}
  .subnav button{white-space:nowrap;flex:none}
}
/* ---------- 문서(A4) ---------- */
#doc{display:block;overflow-x:auto;padding-bottom:8px}
#doc .paper{margin:0 auto 20px}
.paper{background:#fff;color:#000;width:210mm;min-height:297mm;padding:16mm 15mm;box-shadow:0 2px 14px rgba(0,0,0,.18);font-family:var(--doc);font-size:10pt;line-height:1.5}
.paper h2{font-size:12.5pt;margin:14px 0 6px;font-weight:700}
.paper h3{font-size:11pt;margin:10px 0 4px;font-weight:700}
.paper p{margin:2px 0}
.paper .note{font-size:9.5pt;margin:2px 0 8px}
.paper .unit{text-align:right;font-size:9pt;margin:0 0 2px}
.t{width:100%;border-collapse:collapse;margin:4px 0 12px;font-size:9.5pt}
.t th,.t td{border:1px solid #000;padding:3px 5px;text-align:center;vertical-align:middle}
.t th{background:#e6e6e6;font-weight:700}
.t td.l{text-align:left}
.t tr.sum td,.t tr.sum th{background:#f2f2f2;font-weight:700}
.t tr,.t tbody.grp{break-inside:avoid}
.t thead{display:table-header-group}
.paper h2,.paper h3,.paper .unit,.paper .keepnext{break-after:avoid;break-inside:avoid}
.blk{break-inside:avoid}
.lines p{break-inside:avoid}
.t td.cap{border:none;text-align:left;padding:0 0 2px;font-weight:700}
.t td.cap span{float:right;font-weight:400;font-size:9pt}
.doc-title{border:2px solid #000;text-align:center;font-size:17pt;font-weight:700;padding:10px;margin-bottom:10px;letter-spacing:.05em}
.doc-title.sub{font-size:13pt;line-height:1.5}
.cover th{width:auto}
.cover .stmt{padding:18px 14px;line-height:2}
.contact{border:1px solid #000;padding:8px 12px;margin-top:16px}
.lines p{padding-left:1em;text-indent:-1em}

@media (max-width:640px){.bar h1{font-size:15px}.paper{transform-origin:top left}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@page{size:A4;margin:12mm}
@media print{
  body{background:#fff}
  header.bar,.no-print,#tab-input,#tab-records,#tab-status,#tab-entry,#tab-verify,#tab-settle{display:none!important}
  #tab-preview{display:block!important}
  html,body,main,#tab-preview,#doc{width:auto!important;max-width:none!important;overflow:visible!important;padding:0!important;margin:0!important;transform:none!important}
  #doc{display:block!important}
  #doc .paper,.paper{box-shadow:none;width:auto!important;min-width:0!important;min-height:0;padding:0;margin:0!important;transform:none!important;break-after:page}
  .paper:last-child{break-after:auto}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
</head>
<body>
<div id="gate" hidden role="dialog" aria-modal="true" aria-labelledby="gateTitle">
  <div class="gate-card">
    <div class="gate-brand"><b id="gateTitle">국비 교부신청서 작성기</b><span>교부신청 · 실적 · 정산을 한곳에서</span></div>
    <div id="gateBody"></div>
  </div>
</div>
<header class="bar">
  <div class="bar-in">
    <h1>국비 교부신청서 작성기</h1>
    <select id="yearSel" class="yearsel" aria-label="연도 선택"></select>
    <span class="chip" id="curChip"></span>
    <span id="saved"></span>
    <button id="cloudChip" class="cloudchip off" data-tab="records" title="서버 동기화 상태 · 누르면 설정">이 PC에만 저장</button>
    <span class="spacer"></span>
    <div class="actions">
      <button class="primary" data-act="print">인쇄 · PDF 저장</button>
      <button data-act="newRound">새 회차 만들기</button>
      <button data-act="exportHwpx" title="보고 있는 문서를 한글 파일로 저장합니다 (정산 탭이나 미리보기에서 정산보고서를 보고 있으면 정산보고서)">한글 파일(.hwpx)</button>
      <button data-act="exportJson">백업(JSON)</button>
      <button data-act="importJson">복원</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="input" aria-selected="true">입력</button>
    <button role="tab" data-tab="preview" aria-selected="false">미리보기</button>
    <button role="tab" data-tab="verify" aria-selected="false">검증</button>
    <button role="tab" data-tab="status" aria-selected="false">실적 현황</button>
    <button role="tab" data-tab="entry" aria-selected="false">실적 등록</button>
    <button role="tab" data-tab="settle" aria-selected="false">정산 · 실적보고</button>
    <button role="tab" data-tab="records" aria-selected="false">신청 기록</button>
  </nav>
</header>

<main>
  <section id="tab-input">
    <div class="sheet-layout">
      <nav class="subnav" id="sheetNav" aria-label="신청서 항목"></nav>
      <div style="min-width:0;display:grid;gap:12px"><div id="checks" class="checks compact"></div><div id="form"></div></div>
    </div>
  </section>

/* =========================================================
   연도 치환 · 데이터 이전
   문구에 {연도} {전년도} {전전년도} {다음연도} {원기}를 쓰면 신청서 연도에 맞춰 바뀜
========================================================= */
const NOTOKEN = new Set(['id','createdAt','updatedAt','applyDate','baseDate','periodStart','periodEnd','memo','start','end']);
function walkStrings(o, fn, path = ''){
  if (Array.isArray(o)) o.forEach((v, i) => { if (typeof v === 'string') o[i] = fn(v, path + i, String(i)); else if (v && typeof v === 'object') walkStrings(v, fn, path + i + '.'); });
  else if (o && typeof o === 'object') Object.keys(o).forEach(k => { const v = o[k]; if (typeof v === 'string') o[k] = fn(v, path + k, k); else if (v && typeof v === 'object') walkStrings(v, fn, path + k + '.'); });
}
function tokenize(rec){
  const y = n(rec.year);
  const rx = v => new RegExp('(?<!\\d)' + v + '(?!\\d)', 'g');
  walkStrings(rec, (v, p, k) => NOTOKEN.has(k) ? v : v.replace(rx(y), '{연도}').replace(rx(y - 1), '{전년도}').replace(rx(y - 2), '{전전년도}'));
  return rec;
}
const COURSE_ORDER = ['basic', 'advanced', 'master', 'asm', 'leader'];
function prepRecord(r){
  tokenize(r);
  r.units.forEach((u, i) => { if (u.courseId == null) u.courseId = COURSE_ORDER[i] || ''; });
  if (r.autoActual == null) r.autoActual = true;
  if (r.autoPrevYear == null) r.autoPrevYear = true;
  if (r.autoExec == null) r.autoExec = false;
  return r;
}
function migrate(){
  if (n(DB.v) < 2){ DB.records.forEach(prepRecord); DB.programs = DB.programs || {}; DB.v = 2; }
  if (n(DB.v) >= 3 && n(DB.v) < 4){ DB.records.forEach(r => { r.autoActual = true; }); DB.v = 4; }
  if (n(DB.v) < 3){
    DB.records.forEach(r => { if (r.autoPrevYear == null) r.autoPrevYear = true; if (r.autoExec == null) r.autoExec = false; });
    const r1 = DB.records.find(r => n(r.year) === 2026 && n(r.round) === 1 && String(r.memo || '').startsWith('샘플: 1차'));
    if (r1) fillRound1(r1);
    DB.settle = DB.settle || {};
    DB.records.forEach(r => { r.autoActual = true; });
    DB.v = 4;
  }
  DB.records.forEach(r => { const b = ensureBC(r), f = ensureFC(r); Object.keys(b.unitReasons || {}).forEach(k => { if (b.unitReasons[k] && !f.reasons[k]) f.reasons[k] = b.unitReasons[k]; }); b.unitReasons = {}; });
  if (n(DB.v) < 5) DB.v = 5;
}

function fillRound1(r){

  r.grant.requestNow = 73500; r.grant.prevOverride = '';
  r.memo = '원본 HWP(2026년 1차) 값';

  r.exec = {};
}
function applyTokens(rec){
  const y = n(rec.year);
  const map = {'{연도}': y, '{전년도}': y - 1, '{전전년도}': y - 2, '{다음연도}': y + 1, '{원기}': y - 1915};
  let s = JSON.stringify(rec);
  for (const k in map) s = s.split(k).join(String(map[k]));
  return JSON.parse(s);
}
function shiftYear(d, y){ return d ? String(y) + d.slice(4) : d; }

/* 전년도 자료: 전년도 마지막 신청서 + 전년도 실적 기록 + 전년도 정산 집행 */
function prevYearInfo(rec){
  const y = n(rec.year); const PR = latestOf(y - 1); if (!PR) return null;
  const PC = compute(PR), PE = eff(PR);
  const st = progStats(y - 1);
  const TS = DB.settle && DB.settle[y - 1];
  let rate = PC.execAll.rate;
  if (TS && TS.ledger && TS.ledger.length){ const cs = computeSettle(y - 1); rate = pct(cs.f, cs.d); }
  return rec.units.map((u, i) => {
    let k = PR.units.findIndex(x => u.courseId && x.courseId === u.courseId);
    if (k < 0) k = i < PR.units.length ? i : -1;
    if (k < 0) return null;
    const s2 = st.find(t => t.c.id === (u.courseId || PR.units[k].courseId));
    const hasLog = s2 && s2.n;
    return {budget: PC.units[k].yearB, rate, count: hasLog ? s2.doneG : n(PE.units[k].actualG), people: hasLog ? s2.doneP : n(PE.units[k].actual)};
  });
}

function defaultCourses(){
  return [
    {id:'basic', name:'Basic', title:'W-SEL 베이직과정', targetG:45, targetP:675, gUnit:'그룹'},

    {id:'leader', name:'지도자연수', title:'W-SEL 지도자연수', targetG:5, targetP:150, gUnit:'회'}

}
function prog(y){
  y = String(y);
  if (!DB.programs) DB.programs = {};
  if (!DB.programs[y]){
    const prevYs = Object.keys(DB.programs).map(Number).filter(v => v < +y).sort((a, b) => b - a);
    DB.programs[y] = {courses: prevYs.length ? clone(DB.programs[prevYs[0]].courses) : defaultCourses(), entries: []};
  }
  return DB.programs[y];
}
const grpOf = e => (e.groups === '' || e.groups == null) ? 1 : n(e.groups);
function isDone(e, cutoff){ return e.status === '완료' && (!cutoff || (e.end || e.start || '') <= cutoff); }
/* 과정 목표 = 그 해 마지막 신청서의 단위사업 목표 (연결된 과정만). 연결 안 된 과정은 과정 설정 값 */
function courseTarget(y, c){
  const rec = (typeof S !== 'undefined' && S && n(S.year) === n(y)) ? S : latestOf(n(y));
  const u = rec && rec.units.find(x => x.courseId === c.id);
  return u ? {targetG: n(u.targetG), targetP: n(u.target), gUnit: u.gUnit || c.gUnit, linked: true} : {targetG: n(c.targetG), targetP: n(c.targetP), gUnit: c.gUnit, linked: false};
}
function progStats(y, cutoff){
  const P = prog(y);
  return P.courses.map(c0 => { const t0 = courseTarget(y, c0); const c = {...c0, targetG: t0.targetG, targetP: t0.targetP, gUnit: t0.gUnit, linked: t0.linked};
    const es = P.entries.filter(e => e.courseId === c.id);
    const done = es.filter(e => isDone(e, cutoff)), plan = es.filter(e => !isDone(e, cutoff));
    // 인원을 아직 모르는 예정 기록은 과정 목표의 그룹당 인원(예: 675명÷45그룹=15명)으로 추정
    const perG = n(c.targetG) ? n(c.targetP) / n(c.targetG) : 15;
    const noPpl = e => e.people === '' || e.people == null;
    const estG = sum(plan.filter(noPpl).map(grpOf));
    const planP = Math.round(sum(plan.filter(e => !noPpl(e)).map(e => e.people)) + estG * perG);
    const reg = plan.filter(e => e.status !== '완료').length;   // 실제로 '예정·진행중'으로 등록한 기록 수
    return {c, n: es.length, doneG: sum(done.map(grpOf)), doneP: sum(done.map(e => e.people)), planG: sum(plan.map(grpOf)), planP, planReg: reg, planEstG: estG, perG,
      doneNoPpl: done.filter(noPpl).length};
  });
}
/* 인쇄·검증에 쓰는 '완성본': 연도 치환 + 실적 자동 반영 */
function eff(rec){
  const E = applyTokens(rec);
  if (rec.autoPrevYear !== false){ const py = prevYearInfo(rec); if (py) E.units.forEach((u, i) => { if (py[i]) u.prev = {...py[i]}; }); }
  if (rec.autoActual){
    const st = progStats(n(rec.year), rec.baseDate);
    // 그 과정에 실적 기록이 있을 때만 기록 값을 씀. 기록이 없는 과정(예: 지도자연수)은 직접 입력한 값을 그대로 둠
    E.units.forEach(u => { const x = st.find(t => t.c.id === u.courseId); if (x && x.n){ u.actual = x.doneP; u.actualG = x.doneG; if (x.planReg){ u.planned = x.planP; u.plannedG = x.planG; } } });
  }
  return E;
}

function refresh(){

/* 인쇄 쪽나눔 정리: 머리글 반복, 묶음 행 분리 방지, 제목+작은 표 한 덩어리 */
function paginate(html){
  const tpl = document.createElement('template'); tpl.innerHTML = html;
  tpl.content.querySelectorAll('table.t').forEach(tb => {
    const rows = [...tb.rows];
    // 머리글 행(td가 없거나 cap 행)을 thead로
    const head = [];
    for (const r of rows){ const tds = [...r.cells].filter(c => c.tagName === 'TD' && !c.classList.contains('cap')); if (tds.length) break; head.push(r); }
    const thead = document.createElement('thead'); head.forEach(r => thead.appendChild(r));
    // 나머지 행은 rowspan 단위로 tbody 묶음
    const body = rows.slice(head.length); const groups = []; let cur = null, until = -1;
    body.forEach((r, i) => {
      if (i > until){ cur = document.createElement('tbody'); cur.className = 'grp'; groups.push(cur); }
      cur.appendChild(r);
      [...r.cells].forEach(c => { const k = c.rowSpan || 1; if (i + k - 1 > until) until = i + k - 1; });
    });
    [...tb.querySelectorAll('tbody')].forEach(x => x.remove());
    if (head.length) tb.appendChild(thead);
    groups.forEach(g => tb.appendChild(g));
    if (tb.rows.length <= 16 && !tb.classList.contains('cover')) tb.dataset.small = '1';
  });
  // 제목·단위 표기 + 바로 뒤의 작은 표를 한 덩어리로
  tpl.content.querySelectorAll('.paper').forEach(pp => {
    const kids = [...pp.children];
    for (let i = 0; i < kids.length; i++){
      const el = kids[i];
      if (el.tagName === 'TABLE' && el.dataset.small){
        const lead = []; let j = i - 1;
        while (j >= 0 && (/^H[23]$/.test(kids[j].tagName) || kids[j].classList.contains('unit') || (kids[j].tagName === 'P' && /^\s*[□※]/.test(kids[j].textContent)))){ lead.unshift(kids[j]); j--; }
        const box = document.createElement('div'); box.className = 'blk';
        el.before(box); lead.forEach(x => box.appendChild(x)); box.appendChild(el);
      }
    }
  });
  return tpl.innerHTML;
}

/* 목표 사업 수 → 예상 목표 인원 (그룹당 인원: 올해 기록 → 전년 기록 → 1차 신청서 목표 비율 → 15명) */
function perGroupOf(y, courseId, k){
  const fromEntries = yy => { const P = DB.programs && DB.programs[yy]; if (!P || !courseId) return null;
    const es = P.entries.filter(e => e.courseId === courseId && e.people !== '' && e.people != null && n(e.people) > 0);
    const g = sum(es.map(grpOf)), pp = sum(es.map(e => n(e.people))); return g > 0 ? {per: pp / g, src: `${yy}년 실적 기록 ${es.length}건 평균`} : null; };
  const a = fromEntries(y) || fromEntries(y - 1); if (a) return a;
  const r1 = bcAutoBase(S); const u1 = r1 && (r1.units.find(x => courseId && x.courseId === courseId) || r1.units[k]);
  if (u1 && n(u1.targetG) && n(u1.target)) return {per: n(u1.target) / n(u1.targetG), src: `${r1.round}차 신청서 목표 비율`};
  const u = S.units[k]; if (u && n(u.targetG) && n(u.target)) return {per: n(u.target) / n(u.targetG), src: '지금 목표 비율'};
  return {per: 15, src: '기본값'};
}
function estHTML(k){
  const u = S.units[k]; if (!u || u.targetG === '' || u.targetG == null) return '';
  const r = perGroupOf(n(S.year), u.courseId, k); const est = Math.round(n(u.targetG) * r.per);
  const same = est === n(u.target);
  return `<span class="hint" style="font-size:12px">예상 인원 ≈ <b>${fmt(est)}명</b> (${esc(u.gUnit || '그룹')}당 ${fmt(Math.round(r.per * 10) / 10)}명 · ${esc(r.src)})</span>${same ? '' : ` <button class="small" type="button" data-act="applyEst" data-i="${k}">목표 인원에 넣기</button>`}`;
}
function renderProgCourses(){

const won = v => Math.round(n(v) * 1000);

function computeSettle(y){
  y = n(y);

  const a = won(A.totals.subsidy), bS = n(T.funds.sido), bG = n(T.funds.sigungu), c = won(A.totals.self);
  const d = a + bS + bG + c; const e = d ? a / d : 0;
  Object.assign(CS, {a, bS, bG, c, d, e, ePct: d ? Math.round(e * 100) + '%' : '-'});
  const L = T.ledger;
  CS.groups = AC.groups.map(g => {
    const budgetW = won(g.budget); const rows = L.filter(x => x.key === g.key);
    const spentW = sum(rows.map(x => x.amount));
    return {...g, budgetW, spentW, leftW: budgetW - spentW, rate: pct(spentW, budgetW), cnt: rows.length};
  });
  CS.keys = new Set(CS.groups.map(g => g.key));
  CS.budgetTotal = sum(CS.groups.map(g => g.budgetW));
  const f = sum(L.map(x => x.amount)); const fGov = sum(L.filter(x => (x.key || '').endsWith('|국고')).map(x => x.amount));
  const g2 = n(T.calc.prevCarry), h = n(T.calc.prevSpent), i = f + h, j = n(T.calc.revenue), k = n(T.calc.revenueReturned), l = j - k;
  const m = d - f, nn = g2 - h, o = m + nn, p = n(T.calc.interest), q = n(T.calc.nextCarry), r = o + p + k - q;
  const sR = Math.round((a - fGov) + p + k * e - q);
  const tR = (bS + bG) ? Math.round(r * (bS + bG) / d) : 0;
  const uR = r - sR - tR;
  Object.assign(CS, {f, fGov, fSelf: f - fGov, g: g2, h, i, j, k, l, m, nn, o, p, q, r, s: sR, t: tR, u: uR, rateAll: pct(f, d)});
  // 성과
  const st = progStats(y);
  const E = eff(A);
  CS.perf = A.units.map((u, ui) => {

    const useLog = x && x.n;
    const aP = useLog ? x.doneP : n(E.units[ui].actual), aG = useLog ? x.doneG : n(E.units[ui].actualG);
    return {label: u.label, tP: n(u.target), tG: n(u.targetG), gUnit: u.gUnit, aP, aG, rate: n(u.target) ? Math.round(aP / n(u.target) * 100) : 0, fromLog: !!useLog};
  });
  CS.perfT = {tP: sum(CS.perf.map(x => x.tP)), aP: sum(CS.perf.map(x => x.aP))};
  CS.perfT.rate = CS.perfT.tP ? Math.round(CS.perfT.aP / CS.perfT.tP * 100) : 0;

}

function parseDate(t, y){
  t = String(t || '').trim(); let m;
  if ((m = t.match(/^(\d{4})[.\-/년\s]+(\d{1,2})[.\-/월\s]+(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  if ((m = t.match(/^(\d{1,2})[.\-/월\s]+(\d{1,2})/))) return `${y}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`;
  return '';
}
function matchKey(txt, groups){
  const t = String(txt || ''); const self = /자부담|자기부담/.test(t);
  const cands = groups.filter(g => t.includes(g.semok));
  if (!cands.length) return '';
  const f2 = cands.filter(g => g.fund === (self ? '자부담' : '국고'));
  return (f2[0] || (cands.length === 1 ? cands[0] : null))?.key || '';
}
function parsePaste(){
  const y = n(S.year), CS = computeSettle(y), T = settle(y);
  const raw = document.getElementById('lg_paste').value;
  const exist = new Set(T.ledger.map(x => `${x.date}|${x.payee}|${x.amount}`));
  pastePreview = raw.split(/\r?\n/).filter(l2 => l2.trim()).map((line, k) => {
    const c2 = line.includes('\t') ? line.split('\t') : line.split(',');
    if (/일자|날짜/.test(c2[0])) return null;
    const date = parseDate(c2[0], y), key = matchKey(c2[1], CS.groups), payee = String(c2[2] || '').trim();
    const amount = n(String(c2[3] || '').replace(/[^\d.-]/g, '')), purpose = String(c2[4] || '').trim();
    const errs = [];
    if (!date) errs.push('날짜를 읽지 못함');
    else if (date < A_period(y)[0] || date > A_period(y)[1]) errs.push('사업기간 밖');
    if (!key) errs.push('세목을 찾지 못함');
    if (!(amount > 0)) errs.push('금액 없음');
    if (!payee) errs.push('집행처 없음');
    const dup = exist.has(`${date}|${payee}|${amount}`);
    return {k: k + 1, line, rec: {id: uid(), date, key, payee, amount, purpose, proof: '기타', memo: ''}, errs, dup};
  }).filter(Boolean);
  renderPastePrev();
}

function sPathName(p){
  if (SFIELD[p]) return SFIELD[p]; let m;
  if ((m = p.match(/^ledger\.(\d+)/))){ const x = settle(S.year).ledger[+m[1]]; return `집행 장부 · ${x ? `${x.date} ${x.payee} ${fmt(x.amount)}원` : ''}`; }
  if ((m = p.match(/^schedActual\.(\d+)/))) return `세부추진실적 ${+m[1] + 1}번째 항목`;
  if ((m = p.match(/^pva\.(\d+)/))) return `계획대비 실적 ${+m[1] + 1}행`;
  if ((m = p.match(/^calc\.|^funds\./))) return '사업비 · 반환액';
  if ((m = p.match(/^survey\./))) return '만족도 조사';
  return p;
}
function verifySettle(){
  const I = []; const y = n(S.year); const T = settle(y); const CS = computeSettle(y); const A = CS.A;
  const add = (level, area, msg, path, extra) => I.push({level, area, msg, path, root: 'T', ...(extra || {})});
  const [ps, pe] = A_period(y);
  // 기본 정보
  [['info.submitDate', '제출일자'], ['info.orgName', '단체명'], ['info.manager', '담당자 성명'], ['info.officeTel', '사무실전화'], ['info.totalStart', '총 사업기간 시작'], ['info.totalEnd', '총 사업기간 종료']]
    .forEach(([p, nm]) => { if (!String(getP(T, p) || '').trim()) add('오류', '기본 정보', `${nm}이(가) 비어 있습니다.`, p); });
  if (T.info.submitDate && T.info.submitDate < pe) add('주의', '기본 정보', `제출일자(${T.info.submitDate})가 사업 종료일(${pe})보다 이릅니다.`, 'info.submitDate');
  if (T.info.totalStart && T.info.totalEnd && (T.info.totalStart > ps || T.info.totalEnd < pe)) add('오류', '기본 정보', `총 사업기간(${T.info.totalStart} ~ ${T.info.totalEnd})이 당해연도 사업기간(${ps} ~ ${pe})을 포함하지 않습니다.`, 'info.totalStart');
  // 산식
  if (CS.h > CS.g) add('오류', '사업비 · 반환액', '전기이월분 집행액 ⓗ가 전기 이월액 ⓖ보다 큽니다.', 'calc.prevSpent');
  if (CS.k > CS.j) add('오류', '사업비 · 반환액', '수익금 반환액 ⓚ가 수익금 발생액 ⓙ보다 큽니다.', 'calc.revenueReturned');
  if (CS.q > CS.o + CS.p) add('오류', '사업비 · 반환액', '차기 이월액 ⓠ가 집행잔액과 이자를 합한 금액보다 큽니다.', 'calc.nextCarry');
  if (CS.fGov > CS.a) add('오류', '사업비 · 반환액', `국고보조금 집행액(${fmt(CS.fGov)}원)이 보조금(${fmt(CS.a)}원)을 넘습니다.`, null);
  if (CS.fSelf > CS.c) add('주의', '사업비 · 반환액', `자기부담금 집행액(${fmt(CS.fSelf)}원)이 자부담 예산(${fmt(CS.c)}원)을 넘습니다.`, null);
  if (T.ledger.length && CS.s > 0) add('참고', '사업비 · 반환액', `보조금 반환액 ⓢ ${fmt(CS.s)}원이 발생합니다 (국고 집행잔액 ${fmt(CS.a - CS.fGov)}원 + 이자 ${fmt(CS.p)}원 기준).`, 'calc.interest');
  if (T.ledger.length && CS.d && CS.f / CS.d < 0.95) add('주의', '사업비 · 반환액', `전체 집행률이 ${CS.rateAll}입니다. 남은 금액은 반환 대상이 됩니다.`, null);
  // 장부
  const dup = {}; T.ledger.forEach((x, i) => { const k = `${x.date}|${x.payee}|${x.amount}`; (dup[k] = dup[k] || []).push(i); });
  T.ledger.forEach((x, i) => {
    const p = `ledger.${i}`;
    if (!x.date) add('오류', '집행 장부', '집행일자가 비어 있습니다.', p + '.date');
    else if (x.date < ps || x.date > pe) add('오류', '집행 장부', `집행일자 ${x.date}가 사업기간(${ps} ~ ${pe}) 밖입니다.`, p + '.date');
    if (!CS.keys.has(x.key)) add('오류', '집행 장부', '예산에 없는 세목이거나 세목이 비어 있습니다.', p + '.key');
    if (!(n(x.amount) > 0)) add('오류', '집행 장부', '집행금액이 0원이거나 비어 있습니다.', p + '.amount');
    if (!String(x.payee || '').trim()) add('주의', '집행 장부', '집행처가 비어 있습니다.', p + '.payee');
    if (!String(x.purpose || '').trim()) add('주의', '집행 장부', '사용목적이 비어 있습니다.', p + '.purpose');
  });
  Object.values(dup).filter(a2 => a2.length > 1).forEach(a2 => add('주의', '집행 장부', `같은 날짜 · 집행처 · 금액이 ${a2.length}건 있습니다. 이중 지급이 아닌지 확인하세요.`, `ledger.${a2[1]}.amount`));
  CS.groups.forEach(g => { if (g.spentW > g.budgetW) add('오류', '집행 장부', `${groupLabel(g)} 집행액(${fmt(g.spentW)}원)이 예산현액(${fmt(g.budgetW)}원)을 ${fmt(g.spentW - g.budgetW)}원 넘습니다. 비목 변동이 있었다면 신청서 세부 집행내역과 '비목 변동'에 반영하세요.`, null); });
  if (!T.ledger.length) add('오류', '집행 장부', '집행 장부가 비어 있습니다. 일자별 집행내역과 반환액 산출에 필요합니다.', null);
  // 비목 변동
  T.changes.forEach((x, i) => { if (!x.key) add('오류', '비목 변동', '세목이 비어 있습니다.', `changes.${i}.key`); if (!String(x.reason || '').trim()) add('주의', '비목 변동', '변동 사유가 비어 있습니다.', `changes.${i}.reason`); });
  // 성과
  const under = CS.perf.filter(x => x.tP && x.rate < 100), over = CS.perf.filter(x => x.rate >= 150);
  under.forEach(x => add('주의', '사업성과', `${x.label.replace(/\n/g, ' ')} 달성률이 ${x.rate}%로 목표에 못 미칩니다.`, 'texts.cause'));
  if ((under.length || over.length) && !String(T.texts.cause).trim()) add('오류', '사업성과', `${under.length ? '미달성' : '초과달성'} 과정이 있는데 '원인 분석'이 비어 있습니다.`, 'texts.cause');
  const P = prog(y); const notDone = P.entries.filter(e => e.status !== '완료' && (e.end || e.start) && (e.end || e.start) <= (T.info.submitDate || pe));
  if (notDone.length) add('주의', '사업성과', `실적 등록에 아직 '완료'로 바꾸지 않은 기록이 ${notDone.length}건 있습니다. 완료된 수업이면 상태를 바꿔야 실적에 들어갑니다.`, null);
  // 추진실적
  const AE = eff(A);
  AE.sched.forEach((r2, i) => { if (!String(T.schedActual[i]?.text || '').trim() && !schedAutoLines(y, r2.item)) add('주의', '세부추진실적', `“${r2.item.split('\n')[0]}” 항목의 추진실적이 비어 있습니다.`, `schedActual.${i}.text`); });
  T.pva.forEach((x, i) => { if (!String(x.actual || '').trim()) add('주의', '사업개요 · 계획대비', `계획대비 실적 ${i + 1}행의 추진실적이 비어 있습니다.`, `pva.${i}.actual`); });
  if (!T.pva.length) add('주의', '사업개요 · 계획대비', 'Ⅱ. 계획대비 사업추진 실적 표가 비어 있습니다.', null);
  [['texts.ovEffect', '사업개요 · 계획대비'], ['texts.improve', '사업성과'], ['texts.performance', '평가 · 건의'], ['texts.good', '평가 · 건의'], ['texts.weak', '평가 · 건의'], ['texts.future', '평가 · 건의'], ['texts.suggestion', '평가 · 건의']]
    .forEach(([p, area]) => { if (!String(getP(T, p) || '').trim()) add('주의', area, `${SFIELD[p]}이(가) 비어 있습니다.`, p); });
  if (!T.outputs.length) add('참고', '성과물 · 만족도', 'Ⅵ. 추진사업 성과물이 없습니다.', null);
  if (T.survey.use){
    if (n(T.survey.nRel) < 100 || n(T.survey.nNon) < 100) add('주의', '성과물 · 만족도', '설문은 종교인 · 비종교인 각각 100명 이상이어야 합니다.', 'survey.nRel');
    if (!T.survey.date) add('주의', '성과물 · 만족도', '조사일자가 비어 있습니다.', 'survey.date');
  }
  // 문구
  const fields = []; walkStrings(clone({texts: T.texts, info: T.info, schedActual: T.schedActual, pva: T.pva, changes: T.changes}), (v, p, k) => { if (!/date|Date|Start|End|basis|key$/.test(k) && v.trim()) fields.push([p, v]); return v; });
  checkTexts(fields, (l2, a2, m2, p2, ex) => add(l2, a2, m2, p2, ex), y, 'T');
  return I;
}

        rows += L.map((x, k) => `<tr>${k === 0 ? `<td rowspan="${L.length + 1}">${esc(g.mok)}(${esc(g.mokCode)})</td><td rowspan="${L.length}">${esc(g.semok)}(${esc(g.semokCode)})${g.fund === '자부담' ? '<br><small>자기부담금</small>' : ''}</td>` : ''}<td>${pd(x.date)}</td><td>${esc(x.payee)}</td><td style="text-align:right">${fmt(x.amount)}</td><td class="l">${esc(x.purpose)}</td></tr>`).join('')
          + `<tr class="sum"><td colspan="3">소계</td><td style="text-align:right">${fmt(sum(L.map(x => x.amount)))}</td><td></td></tr>`; });
      return `<table class="t"><tr><th>보조비목</th><th>보조세목</th><th>집행일자</th><th>집행처</th><th>집행금액</th><th>사용목적</th></tr>${rows || '<tr><td colspan="6">집행 내역 없음</td></tr>'}<tr class="sum"><td colspan="4">합 계</td><td style="text-align:right">${fmt(CS.f)}</td><td></td></tr></table>`; })()}
    <div class="lines"><p>※ 정산서 첨부물</p><p>① 보조금 통장(사본) 1부</p><p>② 실적보고서 1부</p><p>③ 기타 단체별 필요한 증빙자료 등</p></div></div>`;
  // 실적보고서 표지
  h += `<div class="paper"><div style="height:70mm"></div><div class="doc-title" style="font-size:22pt;padding:18px">보조사업 실적보고서</div>
    <p style="text-align:center;font-size:16pt;font-weight:700;margin-top:30mm">${esc(I.coverTitle)}</p>
    <p style="text-align:center;font-size:14pt;margin-top:40mm">${esc(I.coverOrg)}</p></div>`;
  // 실적보고서 본문
  const AS = A.sched;
  h += `<div class="paper"><div class="doc-title sub">보조사업 실적보고서<br><span style="font-size:10pt;font-weight:400">(${box(I.basis === '총')} 총보조사업비 &nbsp; ${box(I.basis === '순')} 순보조사업비)</span></div>
    <h3>1. 일반현황</h3>${general}
    <h3>2. 당해연도 협약 보조사업비</h3>${agree}
    <h3>3. 보조사업의 목표, 사업수행 실적 및 목표달성 여부</h3>
    <p>□ 사업성과</p>
    <table class="t"><tr><th>성과지표</th><th>측정방법 또는 산식</th><th>목표치</th><th>실적치</th><th>달성률</th></tr>
      ${CS.perf.map((x, k) => `<tr><td>${br(x.label)}</td>${k === 0 ? `<td rowspan="${CS.perf.length}">실적치<br>───── × 100<br>목표치</td>` : ''}<td>${fmt(x.tP)}명(${fmt(x.tG)}${esc(x.gUnit)})</td><td>${fmt(x.aP)}명(${fmt(x.aG)}${esc(x.gUnit)})</td><td>${x.rate}%</td></tr>`).join('')}
      <tr class="sum"><td colspan="2">종합전체실적</td><td>${fmt(CS.perfT.tP)}명</td><td>${fmt(CS.perfT.aP)}명</td><td>${CS.perfT.rate}%</td></tr></table>
    <p>□ 세부추진계획</p>
    <table class="t"><colgroup><col style="width:26%"><col style="width:14%"><col></colgroup><tr><th>세부과제명</th><th>추진계획일정</th><th>추진계획</th></tr>
      ${AS.map(r2 => `<tr><td class="l">ㅇ ${br(r2.item)}</td><td>${br(r2.when)}</td><td class="l">${lines(r2.details).map(l2 => 'ㅇ ' + esc(l2)).join('<br>')}</td></tr>`).join('')}</table>
    <p>□ 세부추진실적</p>
    <table class="t"><colgroup><col style="width:26%"><col style="width:14%"><col></colgroup><tr><th>세부과제명</th><th>실추진일정</th><th>추진실적내용</th></tr>
      ${AS.map((r2, i) => `<tr><td class="l">ㅇ ${br(r2.item)}</td><td>${br(T.schedActual[i]?.when || r2.when)}</td><td class="l">${br(String(T.schedActual[i]?.text || '').trim() ? T.schedActual[i].text : applyTokens({year: y, t: schedAutoLines(y, r2.item)}).t)}</td></tr>`).join('')}</table>
    <p>□ 재원조달실적</p>
    <table class="t"><tr><td class="cap" colspan="4"> <span>(단위: 원)</span></td></tr><tr><th>구분</th><th>예산</th><th>집행</th><th>집행률</th></tr>
      <tr><td>국고보조금</td><td>${fmt(CS.fund.gov.b)}</td><td>${fmt(CS.fund.gov.s)}</td><td>${pct(CS.fund.gov.s, CS.fund.gov.b)}</td></tr>
      <tr><td>자기부담금</td><td>${fmt(CS.fund.self.b)}</td><td>${fmt(CS.fund.self.s)}</td><td>${pct(CS.fund.self.s, CS.fund.self.b)}</td></tr>
      <tr class="sum"><td>계</td><td>${fmt(CS.d)}</td><td>${fmt(CS.f)}</td><td>${CS.rateAll}</td></tr></table>
    <h3>4. 목표 달성·미달성·초과달성의 원인 분석</h3>${lp(T.texts.cause)}
    <h3>5. 외부 지적사항 및 향후 개선계획</h3><p>1) 외부 지적사항(국회, 감사원 등)</p>${lp(T.texts.external)}<p>2) 향후 개선계획</p>${lp(T.texts.improve)}

    <h2>Ⅰ. 사업개요(요약)</h2>
    <table class="t"><colgroup><col style="width:16%"><col style="width:22%"><col style="width:12%"><col></colgroup>
      <tr><th>단 체 명</th><td colspan="3">${esc(A.info.org)}</td></tr>
      <tr><th>사 업 명</th><td colspan="3">${esc(A.info.docProjectName.replace(/^\d{4}년\s*/, ''))}</td></tr>
      <tr><th>사업기간</th><td colspan="3">${ddate(A.info.periodStart)} ~ ${ddate(A.info.periodEnd).replace(/^\d{4}\.\s*/, '')}</td></tr>
      <tr><th>사업장소</th><td colspan="3">${esc(I.place)}</td></tr>
      <tr><th rowspan="4">사 업 비</th><td rowspan="4">총 ${mil(CS.d)}백만원</td><th>보 조 금</th><td>${mil(CS.a)}백만원 (${CS.d ? Math.round(CS.a / CS.d * 100) : 0}%)</td></tr>
      <tr><th>자 부 담</th><td>${mil(CS.c)}백만원 (${CS.d ? Math.round(CS.c / CS.d * 100) : 0}%)</td></tr>
      <tr><th>지자체</th><td>${mil(CS.bS + CS.bG)}백만원 (${CS.d ? Math.round((CS.bS + CS.bG) / CS.d * 100) : 0}%)</td></tr>
      <tr><th>기 타</th><td>-</td></tr>
      <tr><th>사업목적</th><td colspan="3" class="l">${lp(A.text.purpose)}</td></tr>
      <tr><th>사 업<br>추진방법</th><td colspan="3" class="l">${A.units.map(u => `<p><b>○ ${esc(u.label.replace(/\n/g, ' '))} : ${esc(u.audience.replace(/\n/g, ', '))}</b></p>${lp(u.detail)}`).join('')}</td></tr>
      <tr><th>추진실적</th><td colspan="3" class="l">${lp(String(T.texts.ovResult || '').trim() ? T.texts.ovResult : ovAutoText(y))}</td></tr>
      <tr><th>사업성과</th><td colspan="3" class="l">${lp(T.texts.ovEffect)}</td></tr></table>

    <h2>Ⅱ. 계획대비 사업추진 실적</h2>
    <table class="t"><colgroup><col style="width:10%"><col><col style="width:10%"><col><col style="width:20%"></colgroup>
      <tr><th>시 기</th><th>사 업 계 획</th><th>시 기</th><th>추 진 실 적</th><th>사유</th></tr>
      ${T.pva.map(x => `<tr><td>${br(x.planWhen)}</td><td class="l">${br(x.plan)}</td><td>${br(x.actWhen)}</td><td class="l">${br(x.actual)}</td><td class="l">${br(x.reason)}</td></tr>`).join('') || '<tr><td colspan="5">&nbsp;</td></tr>'}</table>
    <h2>Ⅲ. 사업추진성과</h2><table class="t"><tr><td class="l">${lp(T.texts.performance)}</td></tr></table>
    <h2>Ⅳ. 자체평가</h2><table class="t"><tr><td class="l">
      <p><b>○ 사업추진결과 잘된 점</b></p>${lp(T.texts.good)}
      <p><b>○ 수혜자 설문조사(만족도 조사) 결과</b></p>${lp(T.texts.surveyResult)}
      <p><b>○ 예상외 변수 등으로 부진한 점, 사업추진상 문제점 및 애로사항 등</b></p>${lp(T.texts.weak)}
      <p><b>○ 향후 사업추진을 위한 발전 방안 등</b></p>${lp(T.texts.future)}</td></tr></table>
    <h2>Ⅴ. 보조 사업에 관한 개선‧건의사항</h2><table class="t"><tr><td class="l">${lp(T.texts.suggestion)}</td></tr></table>
    <h2>Ⅵ. 추진사업 성과물(자료목록)</h2>
    <table class="t"><tr><th style="width:7%">번호</th><th style="width:15%">자료유형</th><th>성과물 명칭</th><th style="width:9%">수 량</th><th style="width:28%">비 고</th></tr>
      ${T.outputs.map((x, k) => `<tr><td>${k + 1}</td><td>${esc(x.type)}</td><td class="l">${esc(x.name)}</td><td>${esc(x.qty)}</td><td class="l">${br(x.note)}</td></tr>`).join('') || '<tr><td colspan="5">&nbsp;</td></tr>'}</table>
    ${T.survey.use ? `<h2>Ⅶ. 인식 및 만족도 조사 결과</h2>
      <h3>설문조사(만족도 조사) 결과 평가서</h3>
      <div class="lines"><p>□ 설문개요</p><p>○ 조사일자 : ${kdate(T.survey.date)}</p><p>○ 조사대상 : ${esc(T.survey.target)}</p>
      <p>○ 설문응답 : 총 ${fmt(n(T.survey.nRel) + n(T.survey.nNon))}명 (종교인 ${fmt(T.survey.nRel)}명, 비종교인 ${fmt(T.survey.nNon)}명)</p>
      <p>□ 설문결과 분석</p><p>○ 전반적 만족도(문10) : 만족(⑤+⑥+⑦) 비율 ${fmt(T.survey.satisfied)}%</p></div>
      <table class="t"><tr><th>구분</th><th>내용</th><th>평균</th></tr>
        <tr><td>이미지(문7)</td><td>문7의 1) ~ 4) 4개 항목</td><td>${fmt(T.survey.q7)}</td></tr>
        <tr><td>내용 및 품질(문8)</td><td>문8의 1) ~ 3) 3개 항목</td><td>${fmt(T.survey.q8)}</td></tr>
        <tr><td>주관기관(문9)</td><td>문9의 1) ~ 3) 3개 항목</td><td>${fmt(T.survey.q9)}</td></tr>
        <tr><td>행사 참여/추천 의향(문11)</td><td>문11의 1) ~ 3) 3개 항목</td><td>${fmt(T.survey.q11)}</td></tr>
        <tr><td>행사 성과(문12)</td><td>문12의 1) ~ 3) 3개 항목</td><td>${fmt(T.survey.q12)}</td></tr></table>
      <p>○ 행사에 대한 의견</p>${lp(T.survey.opinion)}` : ''}
  </div>`;
  return paginate(h);
}

/* =========================================================
   한글(HWPX) 파일 만들기 — 미리보기 문서(HTML)를 한글 문서 구조로 옮김
========================================================= */
const HWPX = (() => {
  const PAGE_W = 59528, MARGIN = 3402, BODY_W = PAGE_W - MARGIN * 2; /* 인쇄(@page 12mm)와 같은 여백 → 본문 폭 186mm */
  let KX = 75; /* 화면 px → HWPUNIT (측정 시 다시 계산) */
  const xesc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
  let pid = 1000;
  function makeStyles(header){
    const charBase = header.match(/<hh:charPr id="0"[\s\S]*?<\/hh:charPr>/)[0];
    const paraBase = header.match(/<hh:paraPr id="0"[\s\S]*?<\/hh:paraPr>/)[0];
    const bfBase = '<hh:borderFill id="__ID__" threeD="0" shadow="0" centerLine="NONE" breakCellSeparateLine="0"><hh:slash type="NONE" Crooked="0" isCounter="0"/><hh:backSlash type="NONE" Crooked="0" isCounter="0"/><hh:leftBorder type="__B__" width="0.12 mm" color="#000000"/><hh:rightBorder type="__B__" width="0.12 mm" color="#000000"/><hh:topBorder type="__B__" width="0.12 mm" color="#000000"/><hh:bottomBorder type="__B__" width="0.12 mm" color="#000000"/><hh:diagonal type="NONE" width="0.12 mm" color="#000000"/>__FILL__</hh:borderFill>';
    const st = {chars: [], paras: [], bfs: [], cmap: {}, pmap: {}, bmap: {}, charNext: 7, paraNext: 20, bfNext: 3};
    st.char = (size, bold) => {
      const k = size + '|' + (bold ? 1 : 0);
      if (st.cmap[k] != null) return st.cmap[k];
      const id = st.charNext++;
      let x = charBase.replace('id="0"', `id="${id}"`).replace(/height="\d+"/, `height="${Math.round(size * 100)}"`);
      if (bold) x = x.replace('<hh:underline', '<hh:bold/><hh:underline');
      st.chars.push(x); return (st.cmap[k] = id);
    };
    st.para = (align, line, prev, next) => {
      line = line || 160; prev = prev || 0; next = next || 0;
      const k = [align, line, prev, next].join('|');
      if (st.pmap[k] != null) return st.pmap[k];
      const id = st.paraNext++;
      let x = paraBase.replace('id="0"', `id="${id}"`).replace(/horizontal="[A-Z]+"/, `horizontal="${align}"`)
        .replace(/<hh:lineSpacing type="PERCENT" value="\d+"/g, `<hh:lineSpacing type="PERCENT" value="${line}"`)
        .replace(/<hc:prev value="\d+"/g, `<hc:prev value="${prev}"`).replace(/<hc:next value="\d+"/g, `<hc:next value="${next}"`);
      st.paras.push(x); return (st.pmap[k] = id);
    };
    st.bf = (fill, border = true) => {
      const k = (fill || '') + '|' + border;
      if (st.bmap[k] != null) return st.bmap[k];
      const id = st.bfNext++;
      st.bfs.push(bfBase.replace('__ID__', id).replace(/__B__/g, border ? 'SOLID' : 'NONE')
        .replace('__FILL__', fill ? `<hc:fillBrush><hc:winBrush faceColor="${fill}" hatchColor="#FF000000" alpha="0"/></hc:fillBrush>` : ''));
      return (st.bmap[k] = id);
    };
    st.apply = h => {
      const ins = (tag, items) => {
        h = h.replace(new RegExp(`<hh:${tag} itemCnt="(\\d+)">`), (m, c) => `<hh:${tag} itemCnt="${+c + items.length}">`);
        h = h.replace(`</hh:${tag}>`, items.join('') + `</hh:${tag}>`);
      };
      ins('charProperties', st.chars); ins('paraProperties', st.paras); ins('borderFills', st.bfs);
      return h;
    };
    return st;
  }
  // ---- HTML → 문단(런) 목록 ----
  const BLOCK = /^(P|DIV|H1|H2|H3|H4|LI|UL|OL|TABLE|TR)$/;
  function sizeOf(el, def){
    const m = (el.getAttribute && el.getAttribute('style') || '').match(/font-size:\s*([\d.]+)pt/);
    return m ? +m[1] : def;
  }
  function alignOf(el, def){
    const s = (el.getAttribute && el.getAttribute('style')) || '';
    const m = s.match(/text-align:\s*(left|right|center)/);
    if (m) return m[1].toUpperCase();
    if (el.classList && el.classList.contains('l')) return 'LEFT';
    return def;
  }
  function toParas(el, ctx){
    // ctx: {size, bold, align}
    const out = []; let cur = null;
    const start = c => { cur = {runs: [], align: c.align}; };
    const flush = () => { if (cur && (cur.runs.length || cur.forceEmpty)) out.push(cur); cur = null; };
    function walk(node, c){
      if (node.nodeType === 3){
        const t = node.nodeValue.replace(/\s+/g, ' ');
        if (!t.trim() && !(cur && cur.runs.length)) return;
        if (!cur) start(c);
        cur.runs.push({text: t, size: c.size, bold: c.bold});
        return;
      }
      if (node.nodeType !== 1) return;
      const tag = node.tagName;
      if (tag === 'BR'){ if (!cur) start(c); cur.forceEmpty = true; flush(); return; }
      if (tag === 'STYLE' || tag === 'SCRIPT') return;
      const c2 = {size: sizeOf(node, c.size), bold: c.bold || tag === 'B' || tag === 'STRONG' || tag === 'TH' || /font-weight:\s*(700|bold)/.test(node.getAttribute('style') || ''), align: alignOf(node, c.align)};
      if (tag === 'SMALL') c2.size = Math.max(7, c.size - 1.5);
      if (BLOCK.test(tag)){ flush(); [...node.childNodes].forEach(ch => walk(ch, c2)); flush(); }
      else [...node.childNodes].forEach(ch => walk(ch, c2));
    }
    [...el.childNodes].forEach(ch => walk(ch, ctx)); flush();
    out.forEach(p => { if (p.runs.length){ p.runs[0].text = p.runs[0].text.replace(/^\s+/, ''); const L = p.runs[p.runs.length - 1]; L.text = L.text.replace(/\s+$/, ''); } });
    return out;
  }
  function paraXml(st, p, opts = {}){
    const runs = p.runs.length ? p.runs : [{text: '', size: opts.size || 10, bold: false}];
    const pp = st.para(p.align || opts.align || 'JUSTIFY', opts.line, opts.prev, opts.next);
    return `<hp:p id="${pid++}" paraPrIDRef="${pp}" styleIDRef="0" pageBreak="${opts.pageBreak ? 1 : 0}" columnBreak="0" merged="0">`
      + runs.map(r => `<hp:run charPrIDRef="${st.char(r.size || 10, r.bold)}">${r.text ? `<hp:t>${xesc(r.text)}</hp:t>` : '<hp:t/>'}</hp:run>`).join('') + '</hp:p>';
  }
  // ---- 표 ----
  function colWidths(tb, nCol){
    const pct = Array(nCol).fill(null);
    const cols = [...tb.querySelectorAll(':scope > colgroup > col')];
    const toPct = w => { if (!w) return null; let m; if ((m = w.match(/([\d.]+)%/))) return +m[1]; if ((m = w.match(/([\d.]+)px/))) return +m[1] / 7; return null; };
    cols.forEach((c, i) => { if (i < nCol) pct[i] = toPct(c.style.width || c.getAttribute('width')); });
    // 첫 줄 셀의 width
    const firstRow = [...tb.rows].find(r => !r.querySelector('td.cap'));
    if (firstRow){ let ci = 0; [...firstRow.cells].forEach(c => { const sp = c.colSpan || 1; if (sp === 1 && pct[ci] == null) pct[ci] = toPct(c.style.width); ci += sp; }); }

// Esc를 눌러도 로그인 화면이 닫히거나 입력이 지워지지 않게
document.addEventListener('keydown', e => {

document.addEventListener('click', e => {

  })[t.dataset.gact]?.();

document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-gform]'); if (!f) return;
  e.preventDefault(); if (gateBusy) return;
  const v = id => (document.getElementById(id)?.value || '').trim();
  const kind = f.dataset.gform;
  const keepEmail = () => { const em = document.getElementById('g_email'); if (em) em.value = email; };
  const email = v('g_email').toLowerCase();
  if (kind === 'login'){
    if (!isEmail(email)) { showGate('login', '아이디(이메일)를 정확히 넣어 주세요.', true); return; }
    const pw = document.getElementById('g_pw').value; if (!pw) { showGate('login', '비밀번호를 넣어 주세요.', true); keepEmail(); return; }
    gateBusy = true; renderGate(); keepEmail();
    const {data, error} = await cloud.sb.auth.signInWithPassword({email, password: pw});
    gateBusy = false;
    if (error){
      const m = /Invalid login/i.test(error.message) ? '아이디나 비밀번호가 맞지 않습니다.' : /not confirmed/i.test(error.message) ? '이메일 인증을 아직 하지 않았습니다. 가입할 때 받은 메일의 링크를 누르세요.' : '로그인하지 못했습니다: ' + error.message;
      showGate('login', m, true); keepEmail(); document.getElementById('g_pw').focus(); return;
    }
    cloud.user = data.user; return afterLogin();
  }
  if (kind === 'signup'){
    const name = v('g_name'), pw = document.getElementById('g_pw').value, pw2 = document.getElementById('g_pw2').value;
    const err = !name ? '이름을 넣어 주세요.' : !isEmail(email) ? '이메일을 정확히 넣어 주세요.' : pw.length < 8 ? '비밀번호는 8자 이상이어야 합니다.' : pw !== pw2 ? '비밀번호 확인이 다릅니다.' : '';
    const keepAll = () => { document.getElementById('g_name').value = name; keepEmail(); };
    if (err){ showGate('signup', err, true); keepAll(); return; }
    gateBusy = true; renderGate(); keepAll();
    const {data, error} = await cloud.sb.auth.signUp({email, password: pw, options: {data: {name}, emailRedirectTo: baseUrl()}});
    gateBusy = false;
    if (error){ showGate('signup', /already registered/i.test(error.message) ? '이미 가입된 이메일입니다. 로그인하거나 비밀번호 찾기를 이용하세요.' : '가입하지 못했습니다: ' + error.message, true); keepAll(); return; }
    if (data.session){ cloud.user = data.user; return afterLogin(); }
    showGate('login', `${email}로 인증 메일을 보냈습니다. 메일의 링크를 누른 뒤 로그인하세요.`); keepEmail(); return;
  }
  if (kind === 'reset'){
    if (!isEmail(email)) { showGate('reset', '가입한 이메일을 넣어 주세요.', true); return; }
    gateBusy = true; renderGate(); keepEmail();
    const {error} = await cloud.sb.auth.resetPasswordForEmail(email, {redirectTo: baseUrl()});
    gateBusy = false;
    showGate('reset', error ? '메일을 보내지 못했습니다: ' + error.message : `${email}로 비밀번호 재설정 메일을 보냈습니다. 메일이 안 보이면 스팸함도 확인하세요.`, !!error); keepEmail(); return;
  }
  if (kind === 'newpw'){
    const pw = document.getElementById('g_pw').value, pw2 = document.getElementById('g_pw2').value;
    if (pw.length < 8 || pw !== pw2) return showGate('newpw', pw.length < 8 ? '비밀번호는 8자 이상이어야 합니다.' : '비밀번호 확인이 다릅니다.', true);
    gateBusy = true; renderGate();
    const {error} = await cloud.sb.auth.updateUser({password: pw});
    gateBusy = false;
    if (error) return showGate('newpw', '바꾸지 못했습니다: ' + error.message, true);
    history.replaceState(null, '', baseUrl());
    const {data} = await cloud.sb.auth.getUser(); cloud.user = data.user;
    setCloud('ok', '비밀번호를 바꿨습니다.'); return afterLogin();
  }
}, true);

/* ---------- 연결 · 로그인 ---------- */
async function cloudInit(){
  const c = cloudCfg();
  showGate('loading');
  if (!window.supabase || !window.supabase.createClient){ showGate('loading', '서버 연결 도구를 불러오지 못했습니다. 인터넷 연결을 확인하세요.', true); return; }
  try {
    cloud.sb = window.supabase.createClient(c.url, c.key, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: cloudLS('auth')}});
    cloud.sb.auth.onAuthStateChange((ev, session) => {
      if (ev === 'PASSWORD_RECOVERY'){ cloud.user = session ? session.user : null; showGate('newpw', '메일 확인이 끝났습니다. 새 비밀번호를 정하세요.'); }
    });
    if (/type=recovery/.test(location.hash)) return;   // 재설정 링크로 들어온 경우: 위 이벤트가 화면을 띄움
    const {data} = await cloud.sb.auth.getSession();
    cloud.user = data && data.session ? data.session.user : null;
    if (!cloud.user){ setCloud('login', ''); showGate('login'); return; }
    await afterLogin();
  } catch (e) { showGate('loading', '서버에 연결하지 못했습니다: ' + e.message, true); }
}
async function afterLogin(){
  if (/access_token|type=signup/.test(location.hash)) history.replaceState(null, '', baseUrl());
  const em = (cloud.user.email || '').toLowerCase();
  const {data, error} = await cloud.sb.from('app_members').select('email, name, approved, role').eq('email', em).maybeSingle();
  if (error){ showGate('loading', '회원 정보를 확인하지 못했습니다: ' + error.message + ' (setup.sql을 실행했는지 확인하세요)', true); return; }
  cloud.member = data;
  if (!data || !data.approved){ showGate('pending', data ? '' : '회원 명단에 없는 계정입니다. 관리자에게 등록을 요청하세요. (setup.sql을 실행하기 전에 가입한 계정이면 관리자가 명단에 추가해야 합니다)', !data); return; }
  hideGate(); setCloud('sync', ''); await cloudPull('login');
}
async function cloudLogout(){
  if (cloud.sb) await cloud.sb.auth.signOut();
  cloud.user = null; cloud.member = null; cloud.members = null; cloud.history = null; setBase({version: null, dirty: false});
  setCloud('login', ''); showGate('login', '로그아웃했습니다.');
}

/* ---------- 동기화 ---------- */
async function fetchRemote(){
  const {data, error} = await cloud.sb.from('app_state').select('data, version, updated_at, updated_by').eq('id', CLOUD_ROW).maybeSingle();
  if (error) throw new Error(/permission|policy|42501/.test(error.message + error.code) ? '서버 자료를 볼 권한이 없습니다. 관리자 승인을 확인하세요.' : error.message);
  return data;
}
async function cloudPull(reason){
  if (!cloud.sb || !cloud.user || !cloud.member?.approved) return;
  setCloud('sync', '');
  try {
    const remote = await fetchRemote(); const base = cloudBase();
    if (!remote){ await cloudPush(true); return; }
    if (base.version == null){ cloud.conflict = {remote, kind: 'first'}; setCloud('conflict', ''); switchTab('records'); return; }
    if (remote.version === base.version){ if (base.dirty) return cloudPush(); cloud.lastSync = new Date(); setCloud('ok', ''); return; }
    if (!base.dirty){ applyRemote(remote); return; }
    cloud.conflict = {remote, kind: 'both'}; setCloud('conflict', ''); switchTab('records');
  } catch (e) { setCloud('error', e.message); }
}
function applyRemote(remote){
  const keepId = DB.currentId;
  if (!remote.data || !remote.data.records || !remote.data.records.length){ setCloud('error', '서버 자료가 비어 있습니다.'); return; }
  DB = remote.data; migrate();
  S = DB.records.find(r => r.id === keepId) || DB.records[DB.records.length - 1]; DB.currentId = S.id;
  try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); } catch (e) {}
  setBase({version: remote.version, dirty: false}); cloud.conflict = null; cloud.lastSync = new Date();
  renderForm();
  const vis = ['preview', 'records', 'status', 'entry', 'verify', 'settle'].find(k => !document.getElementById('tab-' + k).hidden); if (vis) switchTab(vis);
  setCloud('ok', `서버 자료(버전 ${remote.version}, ${remote.updated_by || ''} ${new Date(remote.updated_at).toLocaleString('ko-KR')})를 불러왔습니다.`);
}
function cloudMarkDirty(){
  if (!cloud.sb || !cloud.user || !cloud.member?.approved) return;
  const b = cloudBase(); b.dirty = true; setBase(b);
  if (cloud.state !== 'conflict') setCloud('dirty', '');
  clearTimeout(cloud.timer); cloud.timer = setTimeout(() => cloudPush(), 2000);
}
async function cloudPush(force){
  if (!cloud.sb || !cloud.user || (cloud.state === 'conflict' && !force)) return;
  if (cloud.busy){ cloud.again = true; return; }
  cloud.busy = true; setCloud('sync', '');
  try {
    const base = cloudBase(); const payload = payloadOf(); let res;
    if ((force === true && base.version == null) || force === 'overwrite'){
      const remote = await fetchRemote();
      if (!remote) res = await cloud.sb.from('app_state').insert({id: CLOUD_ROW, data: payload, version: 1}).select('version');
      else res = await cloud.sb.from('app_state').update({data: payload, version: remote.version + 1}).eq('id', CLOUD_ROW).eq('version', remote.version).select('version');
    } else {
      res = await cloud.sb.from('app_state').update({data: payload, version: base.version + 1}).eq('id', CLOUD_ROW).eq('version', base.version).select('version');
    }
    if (res.error) throw new Error(/permission|policy|42501/.test(res.error.message + res.error.code) ? '서버에 저장할 권한이 없습니다. 관리자 승인을 확인하세요.' : res.error.message);
    if (!res.data || !res.data.length){ const remote = await fetchRemote(); cloud.conflict = {remote, kind: 'both'}; setCloud('conflict', ''); switchTab('records'); return; }
    setBase({version: res.data[0].version, dirty: false}); cloud.conflict = null; cloud.lastSync = new Date(); setCloud('ok', '');
  } catch (e) { setCloud('error', '서버에 저장하지 못했습니다: ' + e.message + ' (이 브라우저에는 저장되어 있습니다)'); }
  finally { cloud.busy = false; if (cloud.again){ cloud.again = false; setTimeout(() => cloudPush(), 500); } }
}
async function cloudResolve(choice){
  const cf = cloud.conflict; if (!cf) return;
  if (choice === 'server'){
    download(`서버자료로_바꾸기전_백업_${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-')}.json`, new Blob([JSON.stringify(DB, null, 2)], {type: 'application/json'}));
    applyRemote(cf.remote);
  } else if (choice === 'local'){ cloud.conflict = null; setCloud('sync', ''); await cloudPush('overwrite'); }
}
async function cloudLoadHistory(){
  const {data, error} = await cloud.sb.from('app_state_history').select('hid, version, saved_at, saved_by').eq('id', CLOUD_ROW).order('hid', {ascending: false}).limit(30);
  cloud.history = error ? [] : data; if (error) cloud.msg = '버전 기록을 불러오지 못했습니다: ' + error.message;
  renderCloudPanel();
}
async function cloudRestore(hid){
  const {data, error} = await cloud.sb.from('app_state_history').select('data, version, saved_at').eq('hid', hid).single();
  if (error){ setCloud('error', error.message); return; }
  download(`되돌리기전_백업_${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-')}.json`, new Blob([JSON.stringify(DB, null, 2)], {type: 'application/json'}));
  const keepId = DB.currentId; DB = data.data; migrate();
  S = DB.records.find(r => r.id === keepId) || DB.records[DB.records.length - 1]; DB.currentId = S.id;
  try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); } catch (e) {}
  renderForm(); await cloudPush('overwrite'); cloud.history = null;
  setCloud('ok', `버전 ${data.version}(${new Date(data.saved_at).toLocaleString('ko-KR')})으로 되돌려 서버에 저장했습니다. 되돌리기 전 자료는 백업 파일로 받았습니다.`);
}

        ${cloud.members.map(m => { const me = m.email === (cloud.user.email || '').toLowerCase(); return `<tr${!m.approved ? ' style="background:var(--warn-soft)"' : ''}><td>${esc(m.name || '')}</td><td>${esc(m.email)}</td><td>${new Date(m.created_at).toLocaleDateString('ko-KR')}</td>
          <td>${me ? '관리자' : `<select data-crole="${esc(m.email)}" style="width:auto"><option value="member"${m.role !== 'admin' ? ' selected' : ''}>일반</option><option value="admin"${m.role === 'admin' ? ' selected' : ''}>관리자</option></select>`}</td>
          <td>${m.approved ? '<span class="pill ok">사용 중</span>' : '<span class="pill warn">막힘</span>'}</td>
          <td style="white-space:nowrap">${me ? '<span class="hint">본인</span>' : (m.approved ? `<button class="small" data-cact="unapprove" data-e="${esc(m.email)}">사용 막기</button>` : `<button class="small primary" data-cact="approve" data-e="${esc(m.email)}">다시 허용</button>`)
            + (me ? '' : cloudPending === 'd' + m.email ? `<button class="small danger" data-cact="delYes" data-e="${esc(m.email)}">정말 빼기</button><button class="small" data-cact="cancel">취소</button>` : `<button class="small danger" data-cact="del" data-e="${esc(m.email)}">명단에서 빼기</button>`)}</td></tr>`; }).join('')}
        </tbody></table>`;
    }
  }
  box.innerHTML = h + msg;
}

/* 긴 글 입력칸: 내용 길이에 맞춰 높이 자동 조절 */
const FIELD_SIZING = typeof CSS !== 'undefined' && CSS.supports && CSS.supports('field-sizing', 'content');
function fitTA(el){ if (FIELD_SIZING || !el || el.tagName !== 'TEXTAREA' || !el.offsetParent) return; el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px'; }
function fitAll(){ if (FIELD_SIZING) return; requestAnimationFrame(() => document.querySelectorAll('textarea').forEach(fitTA)); }
document.addEventListener('input', e => fitTA(e.target), true);
document.addEventListener('focusin', e => fitTA(e.target));
new MutationObserver(() => fitAll()).observe(document.getElementById('tab-input').parentElement, {childList: true, subtree: true, attributes: true, attributeFilter: ['hidden']});
window.addEventListener('resize', fitAll);
function switchTab(name){
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === name));
  ['input', 'preview', 'verify', 'status', 'entry', 'settle', 'records'].forEach(k => document.getElementById('tab-' + k).hidden = k !== name);
  if (name === 'settle') renderSettle();
  if (name === 'preview') renderDoc();
  if (name === 'records') renderRecords();
  if (name === 'input' && document.getElementById('form').childElementCount) renderForm();
  if (name === 'status') renderStatus();
  if (name === 'entry') renderEntry();
  if (name === 'verify') renderVerify();
  window.scrollTo(0, 0);
}
const STRUCT = /^(nRounds|autoActual|autoExec|autoPrevYear|units\.\d+\.courseId)$/;
const GROUPKEY = /^items\.\d+\.(fund|mok|mokCode|semok|semokCode)$/;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id && el.id.startsWith('flt_')){ pf[el.id.slice(4)] = el.value; return renderProgList(); }
  if (el.id === 'recAll'){ recAll = el.checked; return renderRecords(); }
  if (el.id === 'sflt'){ sf = el.value; return renderStatusList(); }
  if (el.id && el.id.startsWith('lf_')){ lf[el.id.slice(3)] = el.value; return renderLedgerList(); }
  const p = el.dataset && el.dataset.path; if (!p) return;
  let v = el.value;
  if (el.dataset.bool) v = el.checked;
  if (el.dataset.num){ v = v.replace(/,/g, '').trim(); v = v === '' ? '' : (isNaN(Number(v)) ? v : Number(v)); }
  if (el.dataset.root === 'T'){
    setP(settle(S.year), p, v);
    refreshSettle(); persist();
    if (/^ledger\./.test(p) || /^calc\.|^funds\./.test(p)) renderPerf();
    return;
  }
  if (el.dataset.root === 'P'){
    setP(prog(S.year), p, v);
    renderProgCards(); renderProgMonth(); refresh(); persist(); return;
  }
  if (p === 'year') return persist();
  setP(S, p, v);
  if (el.dataset.cmirror != null){ const c2 = prog(S.year).courses[n(el.dataset.cmirror)]; const f = p.split('.').pop(); if (c2) c2[f === 'target' ? 'targetP' : f] = v; }
  if (GROUPKEY.test(p)){ C = compute(S); renderExec(); }
  refresh(); persist();
});
document.addEventListener('change', e => {
  const p = e.target.dataset && e.target.dataset.path;
  if (!p) return;
  if (e.target.dataset.root === 'T'){ if (/^survey\.use$|^ledger\.\d+\.(key|date|amount)$/.test(p)) { if (p === 'survey.use') renderSettle(); else renderLedgerList(); refreshSettle(); } return; }
  if (e.target.dataset.root === 'P'){ if (/^courses\./.test(p) || /\.(courseId|status)$/.test(p)) { renderProgList(); renderProgCourses(); } return; }
  if (p === 'year'){
    const ny = n(e.target.value.replace(/,/g, ''));
    if (ny < 2000 || ny > 2100){ e.target.value = S.year; return; }
    S.year = ny; ['applyDate', 'baseDate'].forEach(k => S[k] = shiftYear(S[k], ny));
    S.info.periodStart = shiftYear(S.info.periodStart, ny); S.info.periodEnd = shiftYear(S.info.periodEnd, ny);
    persist(); renderForm(); setSaved(`연도를 ${ny}년으로 바꾸고 날짜를 맞췄습니다.`); return;
  }
  if (/^budgetChange\.baseId$/.test(p)){ renderBC(); renderFC(); }
  else if (/^budgetChange\.(use|showAll)$/.test(p)) renderBC();
  if (/^firstChange\.use$/.test(p)) renderFC();
  if (STRUCT.test(p)){ S.nRounds = Math.min(Math.max(n(S.nRounds) || 1, 1), 8); renderForm(); }
});
document.getElementById('yearSel').addEventListener('change', e => {
  const v = e.target.value;
  if (v === 'new') return makeNewYear();
  const r = latestOf(n(v)); if (r) openRecord(r.id);
});
document.addEventListener('focusout', e => {
  const el = e.target; if (el.dataset && el.dataset.num && !el.dataset.plain && el.dataset.path){ const v = getP(rootObj(el.dataset.root), el.dataset.path); el.value = fmt(v); }
});
document.addEventListener('click', e => {
  const sg = e.target.closest('[data-sheet-go]'); if (sg) return goSheet(n(sg.dataset.sheetGo));
  const ssg = e.target.closest('[data-ssheet-go]'); if (ssg) return goSettleSheet(n(ssg.dataset.ssheetGo));
  const es = e.target.closest('[data-esheet]');
  if (es){ const k = es.dataset.esheet; document.querySelectorAll('#entryNav button').forEach(x => x.setAttribute('aria-current', x.dataset.esheet === k)); ['0', '1'].forEach(j => document.getElementById('esheet' + j).hidden = j !== k); return; }
  const b = e.target.closest('[data-tab],[data-act]'); if (!b) return;
  if (b.dataset.tab) return switchTab(b.dataset.tab);
  const a = b.dataset.act, i = n(b.dataset.i), d = n(b.dataset.d);
  const move = (arr) => { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; };
  switch (a){
    case 'print': switchTab('preview'); setTimeout(() => window.print(), 150); return;
    case 'newRound': return makeNewRound();
    case 'applyEst': { const k = n(b.dataset.i), u = S.units[k]; if (!u) return; const r = perGroupOf(n(S.year), u.courseId, k);
      u.target = Math.round(n(u.targetG) * r.per); const c2 = prog(S.year).courses.find(x => x.id === u.courseId); if (c2) c2.targetP = u.target;
      persist(); ['f_units_' + k + '_target'].forEach(id => { const x = document.getElementById(id); if (x) x.value = fmt(u.target); });
      const ci = prog(S.year).courses.findIndex(x => x.id === u.courseId); const y2 = document.getElementById(`pc_${ci}_target`); if (y2) y2.value = fmt(u.target);
      refresh(); return; }
    case 'bcDraft': { const B = computeBC(S); const bc = ensureBC(S); const t = bcAutoSummary(S, B);
      bc.summary = t; persist(); renderBC(); return; }
    case 'newYear': return makeNewYear();
    case 'exportJson': return exportJson();
    case 'exportDoc': return exportDoc();
    case 'exportHwpx': return exportHwpx();
    case 'importJson': return document.getElementById('importFile').click();
    case 'addUnit': S.units.push(unit({label: '새 단위사업', cur: {labor: '', ops: '', rounds: range(n(S.nRounds)).map(() => '')}, plan: {labor: '', ops: '', rounds: range(n(S.nRounds)).map(() => ({labor: '', ops: ''}))}})); break;
    case 'delUnit': if (b.dataset.confirm){ S.units.splice(i, 1); break; } b.dataset.confirm = 1; b.textContent = '정말 삭제'; return;
    case 'moveUnit': move(S.units); break;
    case 'addItem': { const last = [...S.items].reverse().find(x => x.fund === b.dataset.fund) || {}; S.items.push(item(b.dataset.fund, last.mok || '', last.mokCode || '', last.semok || '', last.semokCode || '', '', '', '', '')); break; }
    case 'dupItem': S.items.splice(i + 1, 0, clone(S.items[i])); break;
    case 'delItem': S.items.splice(i, 1); break;
    case 'moveItem': move(S.items); break;
    case 'addSched': S.sched.push({item: '', details: '', when: ''}); break;
    case 'delSched': S.sched.splice(i, 1); break;
    case 'open': return openRecord(b.dataset.id);
    case 'addEntry': return addEntry();
    case 'fillRemain': { const u = S.units[i]; const g = C.gap[i]; u.plannedG = g.remG; u.planned = g.remP; persist(); renderForm(); setSaved(`${u.label.replace(/\n/g, ' ')} 사업예정을 남은 양 ${g.remG}${u.gUnit} ${fmt(g.remP)}명으로 넣었습니다.`); return; }
    case 'autoFix': { if (applyFix(n(b.dataset.k), b.dataset.c != null ? n(b.dataset.c) : null)) afterFix(); return; }
    case 'fixAll': { let k2 = 0; lastIssues.forEach((x, k) => { if (!x.fixed && x.fix && applyFix(k)) k2++; }); if (k2) afterFix(); return; }
    case 'vk': verifyKind = b.dataset.k; return renderVerify();
    case 'dk': docKind = b.dataset.k; return renderDoc();
    case 'settlePreview': docKind = 'settle'; return switchTab('preview');
    case 'settleVerify': verifyKind = 'settle'; return switchTab('verify');
    case 'addLedger': return addLedger();
    case 'delLedger': pendingDelete = b.dataset.id; return renderLedgerList();
    case 'delLedgerYes': { const T = settle(S.year); T.ledger = T.ledger.filter(x => x.id !== b.dataset.id); pendingDelete = null; persist(); renderLedgerList(); refreshSettle(); renderPerf(); return; }
    case 'parsePaste': return parsePaste();
    case 'clearPaste': pastePreview = []; document.getElementById('lg_paste').value = ''; return renderPastePrev();
    case 'commitPaste': { const T = settle(S.year); const ok = pastePreview.filter(x => !x.errs.length && !x.dup); ok.forEach(x => T.ledger.push(x.rec)); pastePreview = []; document.getElementById('lg_paste').value = ''; persist(); renderPastePrev(); renderLedgerList(); refreshSettle(); renderPerf(); document.getElementById('lg_msg').textContent = `붙여넣은 ${ok.length}건을 등록했습니다.`; return; }
    case 'addChange': settle(S.year).changes.push({key: '', before: '', after: '', reason: ''}); persist(); return renderSettle();
    case 'delChange': settle(S.year).changes.splice(i, 1); persist(); return renderSettle();
    case 'addPva': settle(S.year).pva.push({planWhen: '', plan: '', actWhen: '', actual: '', reason: ''}); persist(); return renderSettle();
    case 'delPva': settle(S.year).pva.splice(i, 1); persist(); return renderSettle();
    case 'pvaFromSched': { const T = settle(S.year); const AS = latestOf(n(S.year)).sched; T.pva = AS.map((r2, k) => ({planWhen: r2.when, plan: r2.item + (r2.details ? '\n' + lines(r2.details).map(l2 => '- ' + l2).join('\n') : ''), actWhen: T.schedActual[k]?.when || r2.when, actual: T.schedActual[k]?.text || '', reason: ''})); persist(); return renderSettle(); }
    case 'addOutput': settle(S.year).outputs.push({type: '보고서', name: '', qty: '', note: ''}); persist(); return renderSettle();
    case 'delOutput': settle(S.year).outputs.splice(i, 1); persist(); return renderSettle();
    case 'schedAutoAll': {
      const T = settle(S.year); const y2 = n(S.year); const AS = latestOf(y2).sched; const P = prog(y2);
      AS.forEach((r2, k) => {
        const lines2 = P.courses.map(c2 => { const t2 = r2.item.replace(/\s/g, ''); const key2 = c2.title.replace(/\s/g, ''); return (t2.includes(key2) || (c2.gUnit === '회' && /지도자연수/.test(t2))) ? c2 : null; }).filter(Boolean);
        if (!lines2.length) return;
        const all = courseSummaryLines(y2).split('\n').filter(l2 => lines2.some(c2 => l2.includes(c2.title)));
        if (!all.length) return;
        T.schedActual[k] = T.schedActual[k] || {when: r2.when, text: ''};
        const cur = T.schedActual[k].text || ''; const add2 = all.filter(l2 => !cur.includes(l2));
        T.schedActual[k].text = (cur ? cur + '\n' : '') + add2.join('\n');
      });
      persist(); return renderSettle();
    }
    case 'ovAuto': { const T = settle(S.year); T.texts.ovResult = ovAutoText(n(S.year)); persist(); return renderSettle(); }
    case 'delYear': pendingYear = n(b.dataset.y); return renderRecords();
    case 'delYearNo': pendingYear = null; return renderRecords();
    case 'delYearYes': return deleteYear(n(b.dataset.y));
    case 'delEntry': pendingDelete = b.dataset.id; return renderProgList();
    case 'delEntryYes': { const P = prog(S.year); P.entries = P.entries.filter(x => x.id !== b.dataset.id); pendingDelete = null; persist(); renderProgram(); refresh(); return; }
    case 'addCourse': prog(S.year).courses.push({id: uid(), name: '새 과정', title: '', targetG: '', targetP: '', gUnit: '그룹'}); persist(); return renderProgram();
    case 'delCourse': prog(S.year).courses.splice(i, 1); persist(); renderProgram(); return renderForm();
    case 'syncTargets': { const P = prog(S.year); S.units.forEach(u => { const c2 = P.courses.find(x => x.id === u.courseId); if (c2){ c2.targetG = u.targetG; c2.targetP = u.target; c2.gUnit = u.gUnit; } }); persist(); return renderProgram(); }
    case 'exportCsv': return exportCsv();
    case 'runVerify': return renderVerify();
    case 'goFix': return goFix(n(b.dataset.k));
    case 'aiCopy': return aiCopy();
    case 'dupRec': { const r = clone(DB.records.find(x => x.id === b.dataset.id)); r.id = uid(); r.memo = (r.memo ? r.memo + ' ' : '') + '(복제본)'; r.createdAt = r.updatedAt = new Date().toISOString(); DB.records.push(r); persist(); return renderRecords(); }
    case 'delRec': pendingDelete = b.dataset.id; return renderRecords();
    case 'delRecNo': pendingDelete = null; return renderRecords();
    case 'delRecYes': {
      DB.records = DB.records.filter(x => x.id !== b.dataset.id); pendingDelete = null;
      if (!DB.records.length) DB.records = seedRecords();
      if (!DB.records.find(x => x.id === S.id)){ S = DB.records[DB.records.length - 1]; DB.currentId = S.id; renderForm(); }
      renderYearSel();
      persist(); return renderRecords();
    }
    default: return;
  }
  renderForm(); persist();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.id || e.target.tagName !== 'INPUT') return;
  if (e.target.id.startsWith('na_')) { e.preventDefault(); addEntry(); }
  if (e.target.id.startsWith('lg_')) { e.preventDefault(); addLedger(); }
});
document.getElementById('importFile').addEventListener('change', e => { const f = e.target.files[0]; if (f) importJson(f); e.target.value = ''; });
window.addEventListener('beforeprint', () => renderDoc());

load();
renderForm();
cloudInit();
