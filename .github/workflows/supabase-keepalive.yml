# Supabase 무료 플랜은 7일 동안 활동이 없으면 프로젝트를 일시 중지(휴면)합니다.
# 이 워크플로는 2일마다 Supabase에 접속해 DB에 기록을 남겨 휴면을 막습니다.
# 또 GitHub는 저장소에 60일 동안 변화가 없으면 예약 워크플로를 멈추므로,
# 매달 1일에 keepalive/last-ping.txt를 갱신해 저장소 활동을 만듭니다.
name: Supabase 휴면 방지

on:
  schedule:
    - cron: '7 0 */2 * *'   # 2일마다 UTC 00:07 (한국 시간 09:07)
  workflow_dispatch:         # Actions 화면에서 직접 실행 가능

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Supabase 접속 (keepalive 함수 호출)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::저장소 Settings › Secrets and variables › Actions 에 SUPABASE_URL, SUPABASE_KEY를 등록하세요."
            exit 1
          fi
          # 새 Publishable key(sb_publishable_…)는 apikey 헤더만, 예전 anon 키(eyJ…)는 Authorization도 함께 보냄
          AUTH=()
          case "$SUPABASE_KEY" in eyJ*) AUTH=(-H "Authorization: Bearer $SUPABASE_KEY");; esac
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o resp.txt -w "%{http_code}" -X POST "${SUPABASE_URL%/}/rest/v1/rpc/keepalive" \
              -H "apikey: $SUPABASE_KEY" "${AUTH[@]}" \
              -H "Content-Type: application/json" -d '{}' || echo 000)
            echo "시도 $i: HTTP $code $(cat resp.txt 2>/dev/null)"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 60
          done
          echo "::error::Supabase 접속에 실패했습니다. 프로젝트가 이미 일시 중지되었으면 대시보드에서 Restore 하세요."
          exit 1

      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 저장소 활동 기록 (매달 1일, 또는 직접 실행 시)
        if: ${{ success() }}
        run: |
          day=$(TZ=Asia/Seoul date +%d)
          if [ "$day" != "01" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "오늘은 기록하지 않습니다 (매달 1일만)."; exit 0
          fi
          mkdir -p keepalive
          TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST' > keepalive/last-ping.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keepalive/last-ping.txt
          git commit -m "keepalive: $(cat keepalive/last-ping.txt)" || exit 0
          git push
